services:
  postres:
    image: postgres:16
    container_name: fusion-manaba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fusion_manaba
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fusion_manaba_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fusion_manaba_postgres_data:
